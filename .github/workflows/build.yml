name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: MSBuild ${{ matrix.configuration }} x64
    runs-on: windows-latest

    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Install MFC
        shell: cmd
        run: |
          "%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\setup.exe" modify ^
            --installPath "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise" ^
            --add Microsoft.VisualStudio.Component.VC.ATLMFC ^
            --quiet --norestart --force --wait
          if %ERRORLEVEL% neq 0 if %ERRORLEVEL% neq 3010 exit /b %ERRORLEVEL%

      - name: Build
        run: >
          msbuild MfcSqlite.sln
          /p:Configuration=${{ matrix.configuration }}
          /p:Platform=x64
          /m
          /nologo
          /verbosity:minimal

      - name: Upload artifact
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: MfcSqliteApp-x64-Release
          path: x64\Release\MfcSqliteApp.exe
          if-no-files-found: error
