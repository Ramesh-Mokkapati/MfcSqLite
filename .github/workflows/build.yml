name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build x64
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2.0.0

      - name: Build Debug
        run: >
          msbuild MfcSqlite.sln
          /p:Configuration=Debug
          /p:Platform=x64
          /m
          /nologo
          /verbosity:minimal

      - name: Build Release
        run: >
          msbuild MfcSqlite.sln
          /p:Configuration=Release
          /p:Platform=x64
          /m
          /nologo
          /verbosity:minimal

      - name: Package binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item x64\Debug\MfcSqliteApp.exe   dist\MfcSqliteApp_Debug.exe
          Copy-Item x64\Release\MfcSqliteApp.exe dist\MfcSqliteApp_Release.exe
          Compress-Archive -Path dist\* -DestinationPath MfcSqliteApp-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: MfcSqliteApp-x64
          path: MfcSqliteApp-x64.zip
          if-no-files-found: error
